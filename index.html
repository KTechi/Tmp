<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>コード読み取り</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
    main {
      box-sizing: border-box;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 0.75rem;
      padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
    }
    .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 0.5rem; background: #111; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    video { object-fit: cover; object-position: center; }
    canvas { pointer-events: none; }
    output { display: block; min-height: 3.5rem; padding: 0.75rem; border: 1px solid #888; border-radius: 0.5rem; white-space: pre-wrap; word-break: break-all; }
    button { font: inherit; padding: 0.9rem; }
    p { margin: 0; color: #666; }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <video id="view" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <output id="result">読み取った内容</output>
    <p id="note"></p>
    <button id="toggle" type="button">読み取り開始</button>
  </main>
  <script type="module">
    import { prepareZXingModule, readBarcodes } from 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/es/reader/index.js';

    const labels = { QRCode: 'QR', EAN13: 'EAN-13', EAN8: 'EAN-8', UPCA: 'UPC-A', UPCE: 'UPC-E', Code128: 'Code 128', Code39: 'Code 39', ITF: 'ITF', Codabar: 'Codabar' };
    const view = document.querySelector('#view');
    const overlay = document.querySelector('#overlay');
    const result = document.querySelector('#result');
    const note = document.querySelector('#note');
    const toggle = document.querySelector('#toggle');
    const context = overlay.getContext('2d');
    const capture = document.createElement('canvas');
    const captureContext = capture.getContext('2d', { willReadFrequently: true });
    const readerOptions = {
      formats: ['QRCode', 'EAN13', 'EAN8', 'UPCA', 'UPCE', 'Code128', 'Code39', 'ITF', 'Codabar'],
      tryHarder: false,
      tryRotate: false,
      tryInvert: false,
      tryDownscale: false,
      maxNumberOfSymbols: 1,
    };
    const decodeLongEdge = 720;
    let stream = null;
    let running = false;
    let session = 0;
    let hits = null;
    let scale = 1;
    const wasmReady = prepareZXingModule({ fireImmediately: true });

    function nextFrame() {
      return new Promise((resolve) => requestAnimationFrame(() => resolve()));
    }

    function screenPoints() {
      const box = overlay.getBoundingClientRect();
      const sourceWidth = view.videoWidth || box.width;
      const sourceHeight = view.videoHeight || box.height;
      const cover = Math.max(box.width / sourceWidth, box.height / sourceHeight);
      const left = (box.width - sourceWidth * cover) / 2;
      const top = (box.height - sourceHeight * cover) / 2;
      return hits.map((point) => [
        left + point.x * cover,
        top + point.y * cover,
      ]);
    }

    function paint() {
      const box = overlay.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      const nextWidth = Math.round(box.width * ratio);
      const nextHeight = Math.round(box.height * ratio);
      if (overlay.width !== nextWidth || overlay.height !== nextHeight) {
        overlay.width = nextWidth;
        overlay.height = nextHeight;
      }
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, box.width, box.height);
      const margin = Math.min(box.width, box.height) * 0.12;
      const length = margin * 0.7;
      context.strokeStyle = 'rgba(255,255,255,0.85)';
      context.lineWidth = 3;
      for (const [x, y, dx, dy] of [
        [margin, margin, 1, 1],
        [box.width - margin, margin, -1, 1],
        [margin, box.height - margin, 1, -1],
        [box.width - margin, box.height - margin, -1, -1],
      ]) {
        context.beginPath();
        context.moveTo(x, y + dy * length);
        context.lineTo(x, y);
        context.lineTo(x + dx * length, y);
        context.stroke();
      }
      if (!hits?.length) return;
      const points = screenPoints();
      context.beginPath();
      points.forEach(([x, y], index) => (index ? context.lineTo(x, y) : context.moveTo(x, y)));
      context.closePath();
      context.fillStyle = 'rgba(40, 200, 80, 0.35)';
      context.strokeStyle = '#14c85a';
      context.lineWidth = 4;
      context.fill();
      context.stroke();
    }

    function grab() {
      const sourceWidth = view.videoWidth;
      const sourceHeight = view.videoHeight;
      const edge = Math.max(sourceWidth, sourceHeight);
      const factor = edge > decodeLongEdge ? decodeLongEdge / edge : 1;
      const width = Math.max(1, Math.round(sourceWidth * factor));
      const height = Math.max(1, Math.round(sourceHeight * factor));
      if (capture.width !== width || capture.height !== height) {
        capture.width = width;
        capture.height = height;
      }
      scale = width / sourceWidth;
      captureContext.drawImage(view, 0, 0, width, height);
      return captureContext.getImageData(0, 0, width, height);
    }

    function videoPoints(position) {
      return [position.topLeft, position.topRight, position.bottomRight, position.bottomLeft]
        .map((point) => ({ x: point.x / scale, y: point.y / scale }));
    }

    function halt() {
      session += 1;
      running = false;
      stream?.getTracks().forEach((track) => track.stop());
      stream = null;
      view.srcObject = null;
      hits = null;
      paint();
      toggle.disabled = false;
      toggle.textContent = '読み取り開始';
    }

    async function loop(token) {
      let misses = 0;
      while (running && token === session) {
        if (view.readyState < HTMLMediaElement.HAVE_CURRENT_DATA || !view.videoWidth) {
          await nextFrame();
          continue;
        }
        const image = grab();
        let found = [];
        try {
          found = await readBarcodes(image, readerOptions);
        } catch (error) {
          if (token !== session) return;
          note.textContent = '読み取りに失敗しました。';
          await nextFrame();
          continue;
        }
        if (token !== session) return;
        const hit = found.find((item) => item.isValid && item.text);
        if (hit) {
          misses = 0;
          hits = videoPoints(hit.position);
          const name = labels[hit.format] ?? hit.format;
          const line = `${name}\n${hit.text}`;
          if (result.textContent !== line) result.textContent = line;
        } else if (++misses >= 3) {
          hits = null;
        }
        paint();
        await nextFrame();
      }
    }

    new ResizeObserver(() => paint()).observe(overlay);
    paint();

    toggle.addEventListener('click', async () => {
      if (running) {
        halt();
        return;
      }
      const token = ++session;
      note.textContent = '';
      toggle.disabled = true;
      try {
        await wasmReady;
        if (token !== session) return;
        const media = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 },
          },
        });
        if (token !== session) {
          media.getTracks().forEach((track) => track.stop());
          return;
        }
        stream = media;
        view.srcObject = media;
        await view.play();
        if (token !== session) {
          halt();
          return;
        }
        running = true;
        toggle.disabled = false;
        toggle.textContent = '停止';
        paint();
        loop(token);
      } catch (error) {
        if (token !== session) return;
        halt();
        note.textContent = error?.name === 'NotAllowedError'
          ? 'カメラの使用が拒否されました。'
          : 'カメラを開始できませんでした。';
      }
    });
  </script>
</body>
</html>
